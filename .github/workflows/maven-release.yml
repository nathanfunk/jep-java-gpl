name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'  # Matches your pom.xml configuration
          distribution: 'temurin'
          cache: 'maven'
          server-id: ossrh  # Must match the distributionManagement/repository/id in pom.xml
          server-username: MAVEN_USERNAME  # Will be set from MAVEN_USERNAME
          server-password: MAVEN_PASSWORD  # Will be set from MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE  # Will be set from GPG_PASSPHRASE

      - name: Build and Deploy to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B --no-transfer-progress clean deploy
